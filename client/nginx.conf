server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html; # Перенаправление всех запросов на index.html
    }

    # Для статических файлов (например, CSS, JS)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|otf)$ {
        root /usr/share/nginx/html;
        expires 30d;
        access_log off;
    }
}